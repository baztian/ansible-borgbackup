name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "0 7 * * 2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yaml-lint
        uses: ibiqlik/action-yamllint@v3
      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.11.1
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: molecule
        uses: robertdebock/molecule-action@2.6.8
      - name: molecule Kuma permissions
        uses: robertdebock/molecule-action@2.6.8
        with:
          scenario: kuma
