---
- name: Converge
  hosts: all
  become: yes

  tasks:
    - name: Include this role
      include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        borgmatic_configs:
          backup-etc:
            source_directories:
              - /etc
            repositories:
              - path: /srv/backup_etc
            atime: false
            exclude_patterns:
              - icon_cache
            keep_daily: 7
            keep_weekly: 4
            keep_monthly: 12
          backup-home:
            source_directories:
              - /home
            repositories:
              - path: /srv/backup_home
            atime: false
            exclude_patterns:
              - icon_cache
            keep_daily: 7
            keep_weekly: 4
            keep_monthly: 12
