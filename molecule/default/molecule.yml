---
dependency:
  name: galaxy
driver:
  name: docker
  options:
    # options relevant if started with molecule `create -d delegated` to apply locally
    managed: False
    ansible_connection_options:
      ansible_connection: local
platforms:
  - name: instance
    image: "docker-ubuntu2404-ansible:latest"
    # Not sure why empty command. Maybe to make sure systemd is PID 1?
    # Mount a private cgroup v2 hierarchy before starting systemd as PID 1.
    command: >-
      /bin/sh -c 'mount -t cgroup2 cgroup2 /sys/fs/cgroup && exec /lib/systemd/systemd'
    cgroupns_mode: private
    privileged: True
provisioner:
  name: ansible
  log: True
  inventory:
    host_vars:
      instance:
        ansible_user: ansible
        ansible_remote_tmp: /tmp/.ansible/tmp
verifier:
  name: ansible
