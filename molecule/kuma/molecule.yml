---
dependency:
  name: galaxy
driver:
  name: docker
  options:
    managed: False
    ansible_connection_options:
      ansible_connection: local
platforms:
  - name: root-instance
    image: "docker-ubuntu2404-ansible:latest"
    command: sleep infinity
  - name: debian-instance
    image: "docker-debian13-ansible:latest"
    command: sleep infinity
provisioner:
  name: ansible
  log: True
  inventory:
    host_vars:
      root-instance:
        ansible_user: ansible
      debian-instance:
        ansible_user: ansible
verifier:
  name: ansible
