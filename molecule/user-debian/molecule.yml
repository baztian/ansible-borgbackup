---
dependency:
  name: galaxy
driver:
  name: docker
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
platforms:
  - name: instance-debian
    image: docker-debian13-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
provisioner:
  name: ansible
  log: true
  inventory:
    host_vars:
      instance-debian:
        ansible_user: ansible
verifier:
  name: ansible
