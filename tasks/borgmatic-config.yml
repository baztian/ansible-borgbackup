---
- name: Ensure borgmatic config directory exists
  file:
    path: /etc/borgmatic.d
    state: directory
    mode: '0700'
    owner: root
- name: Configure Uptime Kuma monitoring
  import_tasks: borgmatic-kuma.yml
- name: Add Borgmatic Configurations
  template:
    src: borgmatic_app.yml.j2
    dest: "/etc/borgmatic.d/{{ item.key }}.yml"
    owner: root
    mode: '0600'
  with_items: "{{ borgmatic_configs | dict2items }}"
  no_log: true
  notify:
    - Init Borgmatic repos
