---
- name: Collect configured Uptime Kuma repository tokens
  set_fact:
    _borgmatic_kuma_repositories: >-
      {{
        (borgmatic_kuma.repositories | default({}) | dict2items)
        | selectattr('value.token', 'defined')
        | selectattr('value.token')
        | list
      }}
  changed_when: false
  no_log: true

- name: Validate Uptime Kuma URL
  assert:
    that:
      - borgmatic_kuma.url is defined
      - borgmatic_kuma.url | string | length > 0
    fail_msg: "borgmatic_kuma.url is required when repository tokens are configured."
  when: _borgmatic_kuma_repositories | length > 0

- name: Validate Uptime Kuma repository matchers
  assert:
    that:
      - item.key is match('^[A-Z][A-Z0-9_]*$')
      - item.value.matcher is defined
      - item.value.matcher | string | length > 0
    fail_msg: "Each configured Kuma token needs a valid uppercase key and non-empty matcher."
  loop: "{{ _borgmatic_kuma_repositories }}"
  when: _borgmatic_kuma_repositories | length > 0

- name: Install Uptime Kuma environment file
  template:
    src: borgmatic-kuma.env.j2
    dest: /etc/borgmatic.d/kuma.env
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: _borgmatic_kuma_repositories | length > 0

- name: Install Uptime Kuma push script
  template:
    src: borgmatic-kuma-push.j2
    dest: /usr/local/sbin/borgmatic-kuma-push
    owner: root
    group: root
    mode: '0750'
  when: _borgmatic_kuma_repositories | length > 0

- name: Remove disabled Uptime Kuma files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/borgmatic.d/kuma.env
    - /usr/local/sbin/borgmatic-kuma-push
  when: _borgmatic_kuma_repositories | length == 0
