---
# Run after functional.yml on a disposable container or VM.
- name: Exercise the user service command
  hosts: all
  become: true
  become_user: backup-job
  environment:
    HOME: /home/backup-job
    XDG_CONFIG_HOME: /home/backup-job/.config
  tasks:
    - name: Run the scheduled command
      command:
        argv:
          - borgmatic
          - --config=/home/backup-job/.config/borgmatic.d
          - --verbosity
          - '-1'
          - --syslog-verbosity
          - '1'
      changed_when: false

    - name: List created archives
      command: borgmatic --config /home/backup-job/.config/borgmatic.d rlist --json
      register: archives
      changed_when: false

    - name: Verify the repository has an archive
      assert:
        that:
          - (archives.stdout | from_json)[0].archives | length > 0
