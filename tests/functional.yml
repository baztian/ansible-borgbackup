---
# Run only against a disposable container or VM.
- name: Exercise root and user configurations together
  hosts: all
  become: true
  tasks:
    - name: Install system backup packages
      apt:
        name:
          - borgbackup
          - borgmatic
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the service account
      user:
        name: backup-job
        create_home: true

    - name: Create fixture directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        mode: '0755'
      loop:
        - {path: /srv/test-source, owner: root}
        - {path: /srv/test-user-repository, owner: backup-job}
        - {path: /srv/test-root-repository, owner: root}

    - name: Configure the system role  # noqa role-name[path]
      include_role:
        name: "{{ playbook_dir }}/.."
        tasks_from: borgmatic-config.yml
      vars:
        borgmatic_configs:
          test-root:
            source_directories: [/srv/test-source]
            repositories:
              - path: /srv/test-root-repository
            keep_daily: 7

    - name: Initialize system repositories
      meta: flush_handlers

    - name: Configure the user role  # noqa role-name[path]
      include_role:
        name: "{{ playbook_dir }}/../roles/borgbackup_user"
      vars:
        borgbackup_user_name: backup-job
        borgbackup_user_init_encryption: repokey
        borgbackup_user_timer: daily
        borgbackup_user_configs:
          test-user:
            source_directories: [/srv/test-source]
            repositories:
              - path: /srv/test-user-repository
            encryption_passphrase: test-passphrase
            keep_daily: 7

    - name: List user repository
      command: borgmatic --config /home/backup-job/.config/borgmatic.d --verbosity 1 rlist
      become: true
      become_user: backup-job
      environment:
        HOME: /home/backup-job
      changed_when: false
      register: user_repositories

    - name: List system repository
      command: borgmatic --verbosity 1 rlist
      changed_when: false
      register: system_repositories

    - name: Verify repository discovery is isolated
      assert:
        that:
          - "'/srv/test-user-repository: Listing repository' in user_repositories.stdout"
          - "'/srv/test-root-repository' not in user_repositories.stdout"
          - "'/srv/test-root-repository: Listing repository' in system_repositories.stdout"
          - "'/srv/test-user-repository' not in system_repositories.stdout"
